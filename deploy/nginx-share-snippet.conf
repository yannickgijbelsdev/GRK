# --------------------------------------------------------------------------
# Drop this snippet into the grk.fm nginx server block so that link-preview
# crawlers (WhatsApp, Facebook, Twitter, …) see the correct og:image for an
# article. Real users keep hitting the React SPA.
#
# Place this block INSIDE the existing server {} for grk.fm, ABOVE the
# generic SPA fallback.
# --------------------------------------------------------------------------

# Detect known link-preview/social-media crawlers
map $http_user_agent $is_link_crawler {
    default                                 0;
    "~*facebookexternalhit"                 1;
    "~*Facebot"                             1;
    "~*Twitterbot"                          1;
    "~*LinkedInBot"                         1;
    "~*WhatsApp"                            1;
    "~*TelegramBot"                         1;
    "~*Slackbot"                            1;
    "~*Discordbot"                          1;
    "~*SkypeUriPreview"                     1;
    "~*Pinterest"                           1;
    "~*Mastodon"                            1;
    "~*redditbot"                           1;
    "~*Applebot"                            1;
}

# Article paths: when a crawler hits them, hand the request to the FastAPI
# backend which returns a prerendered HTML with the correct og:image.
# Everything else falls through to the SPA.
location ~ ^/(nieuws|social-club)/[^/]+$ {
    if ($is_link_crawler = 1) {
        # Adjust the upstream to wherever your FastAPI lives in the cluster.
        proxy_pass http://backend:8001;
        break;
    }
    try_files $uri /index.html;
}
