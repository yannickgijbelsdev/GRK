# --------------------------------------------------------------------------
# nginx snippet for grk.fm  (apply inside the `server { … }` block)
#
# Goal: WhatsApp / Facebook / Twitter link-previews must ALWAYS show the
# correct og:image / og:title / og:description for both /nieuws/{slug} and
# /social-club/{slug} URLs, including articles published AFTER the last
# `yarn build`.
#
# Strategy (two-tier):
#   1. Try the build-time prerendered static snapshot first
#      (`/nieuws/{slug}/index.html` or `/social-club/{slug}/index.html`).
#      Fast, edge-cacheable, no backend hit.
#   2. If that file does not exist (= the article was published after the
#      last deploy), fall through to the FastAPI backend which renders the
#      meta tags on-the-fly from the Clara news API.
#
# Real users always end up with the full React SPA — the JS bundle mounts
# the moment the body loads, regardless of which tier handled the request.
# --------------------------------------------------------------------------

# /nieuws/<slug>, /social-club/<slug> and /events-tickets/<slug>
location ~ ^/(nieuws|social-club|events-tickets)/([^/]+)$ {
    # try_files works against the *web root* — adjust the path prefix if your
    # CRA build is mounted somewhere other than /usr/share/nginx/html.
    try_files /$1/$2/index.html @share_fallback;
}

# Fallback: ask FastAPI to generate fresh meta tags for unknown slugs.
location @share_fallback {
    proxy_pass         http://backend:8001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # Short edge cache so a burst of social-scraper hits doesn't hammer the
    # external news API.
    proxy_cache_valid  200 5m;
}
