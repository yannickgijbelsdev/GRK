# --------------------------------------------------------------------------
# nginx snippet for grk.fm
#
# Route /nieuws/{slug} and /social-club/{slug} to the FastAPI backend.
# The backend returns the regular SPA index.html with per-article meta tags
# injected so:
#   * WhatsApp / Facebook / Twitter scrapers see the right og:image, title,
#     description (link-preview cards become article-specific).
#   * Real users still get the full React SPA — the JS bundle mounts as usual
#     and the page works normally. NO meta-refresh, NO redirect loop.
#
# All other paths keep going straight to the SPA static bundle.
# --------------------------------------------------------------------------

location ~ ^/(nieuws|social-club)/[^/]+$ {
    proxy_pass         http://backend:8001;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
